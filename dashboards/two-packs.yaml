        columns: 4
        cards:
          - type: custom:button-card
            entity: sensor.pack1_live_cell_1
            name: |
              [[[
                const s = states['sensor.pack1_live_cell_1'];
                const b = states['binary_sensor.pack1_live_cell_1_balancing'];
                const sl = states['sensor.pack1_live_min_cell']; const sh = states['sensor.pack1_live_max_cell'];
                if (!s) return 'Cell 1';
                const v = parseFloat(s.state);
                const lv = sl ? parseFloat(sl.state) : NaN;
                const hv = sh ? parseFloat(sh.state) : NaN;
                let n = 'Cell 1';
                if (b && b.state === 'on') n += ' ⚡';
                if (!isNaN(lv) && v === lv) n += ' (L)';
                if (!isNaN(hv) && v === hv) n += ' (H)';
                return n;
              ]]]
            state_display: >
              [[[ const v = parseFloat(entity && entity.state); return isNaN(v)
              ? '—' : (v * 1000).toFixed(0) + ' mV'; ]]]
            show_name: true
