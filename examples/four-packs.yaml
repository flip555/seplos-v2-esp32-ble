# 4 packs. Replace the MACs, the API key and the WiFi secrets.
substitutions:
  name: seplos-bms
  friendly_name: Seplos BMS

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  devices:
    - id: pack1_live
      name: "Pack 1 Live"
    - id: pack1_settings
      name: "Pack 1 Settings"
    - id: pack1_diag
      name: "Pack 1 Diagnostics"
    - id: pack2_live
      name: "Pack 2 Live"
    - id: pack2_settings
      name: "Pack 2 Settings"
    - id: pack2_diag
      name: "Pack 2 Diagnostics"
    - id: pack3_live
      name: "Pack 3 Live"
    - id: pack3_settings
      name: "Pack 3 Settings"
    - id: pack3_diag
      name: "Pack 3 Diagnostics"
    - id: pack4_live
      name: "Pack 4 Live"
    - id: pack4_settings
      name: "Pack 4 Settings"
    - id: pack4_diag
      name: "Pack 4 Diagnostics"

external_components:
  - source: github://flip555/seplos-v2-esp32-ble@main
    components: [bms_bridge]

esp32:
  board: esp32dev
  framework:
    type: esp-idf

esp32_ble:
  max_connections: 4

logger:
  level: INFO
  logs:
    esp32_ble_client: WARN
    bms_bridge.ble: WARN

api:
  encryption:
    key: "REPLACE_WITH_A_BASE64_KEY"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
  on_ble_advertise:
    - lambda: |-
        id(hub1)->note_advert(x.address_str(), x.get_rssi(), x.get_name(), (int) x.get_service_uuids().size());
        id(hub2)->note_advert(x.address_str(), x.get_rssi(), x.get_name(), (int) x.get_service_uuids().size());
        id(hub3)->note_advert(x.address_str(), x.get_rssi(), x.get_name(), (int) x.get_service_uuids().size());
        id(hub4)->note_advert(x.address_str(), x.get_rssi(), x.get_name(), (int) x.get_service_uuids().size());

ble_client:
  - mac_address: "60:6E:41:00:00:01"
    id: pack1_client
  - mac_address: "60:6E:41:00:00:02"
    id: pack2_client
  - mac_address: "60:6E:41:00:00:03"
    id: pack3_client
  - mac_address: "60:6E:41:00:00:04"
    id: pack4_client

bms_bridge:
  - id: hub1
    transport: ble
    ble_client_id: pack1_client
    profile: seplos_v2_ble
    address: 0x00
    mac_slot: 1
    read_settings_on_connect: true
    settings_interval: 15min
    update_interval: 12s
  - id: hub2
    transport: ble
    ble_client_id: pack2_client
    profile: seplos_v2_ble
    address: 0x00
    mac_slot: 2
    read_settings_on_connect: true
    settings_interval: 15min
    update_interval: 12s
    poll_offset: 3s
  - id: hub3
    transport: ble
    ble_client_id: pack3_client
    profile: seplos_v2_ble
    address: 0x00
    mac_slot: 3
    read_settings_on_connect: true
    settings_interval: 15min
    update_interval: 12s
    poll_offset: 6s
  - id: hub4
    transport: ble
    ble_client_id: pack4_client
    profile: seplos_v2_ble
    address: 0x00
    mac_slot: 4
    read_settings_on_connect: true
    settings_interval: 15min
    update_interval: 12s
    poll_offset: 9s

