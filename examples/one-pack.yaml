# 1 pack. Replace the MACs, the API key and the WiFi secrets.
substitutions:
  name: van-bms
  friendly_name: Van BMS

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  devices:
    - id: pack1_live
      name: "Pack 1 Live"
    - id: pack1_settings
      name: "Pack 1 Settings"
    - id: pack1_diag
      name: "Pack 1 Diagnostics"

external_components:
  - source: github://flip555/seplos-v2-esp32-ble@main
    components: [bms_bridge]

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  logs:
    esp32_ble_client: WARN
    bms_bridge.ble: WARN

api:
  encryption:
    key: "REPLACE_WITH_A_BASE64_KEY"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
  on_ble_advertise:
    - lambda: |-
        id(hub1)->note_advert(x.address_str(), x.get_rssi(), x.get_name(), (int) x.get_service_uuids().size());

ble_client:
  - mac_address: "60:6E:41:00:00:01"
    id: pack1_client

bms_bridge:
  - id: hub1
    transport: ble
    ble_client_id: pack1_client
    profile: seplos_v2_ble
    address: 0x00
    update_interval: 10s

